[package]
name = "memlat"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Detect rare core stalls during memory accesses, cache-line round trips and core-to-core transfers on Linux x86_64"
license = "Apache-2.0"
repository = "https://github.com/ionutnechita/ionutnechita-memlat-rs"
readme = "README.md"
keywords = ["latency", "real-time", "benchmark", "memory", "tsc"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1   # symbols for perf, no effect on codegen
